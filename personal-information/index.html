<title>个人简介</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #4f6ef7;
    --text: #2b2f36;
    --text-light: #6b7280;
    --accent: #eef1fe;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .profile-card {
    display: flex;
    width: 100%;
    max-width: 960px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(31, 41, 55, 0.10);
    overflow: hidden;
  }

  /* 左侧：个人简介 */
  .intro {
    flex: 1.4;
    padding: 48px 44px;
  }

  .intro .greeting {
    color: var(--primary);
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .intro h1 {
    font-size: 32px;
    margin-bottom: 6px;
  }

  .intro .title {
    font-size: 16px;
    color: var(--text-light);
    margin-bottom: 24px;
  }

  .intro .about {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text-light);
    margin-bottom: 28px;
    text-indent: 2em;
  }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .tag {
    background: var(--accent);
    color: var(--primary);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
  }

  .info-list {
    font-size: 14px;
    line-height: 2.1;
    color: var(--text-light);
  }

  .info-list b {
    color: var(--text);
    font-weight: 600;
    margin-right: 8px;
  }

  /* 右侧：照片 */
  .photo-side {
    flex: 0.75;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 44px 28px;
    position: relative;
  }

  .photo-frame {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid #d7defb;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(79, 110, 247, 0.18);
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none; /* 照片替换后由脚本显示 */
  }

  .photo-placeholder {
    color: rgba(255, 255, 255, 0.9);
    text-align: center;
    font-size: 14px;
    line-height: 1.8;
  }

  .photo-placeholder .icon {
    font-size: 44px;
    display: block;
    margin-bottom: 8px;
  }

  @media (max-width: 760px) {
    .profile-card { flex-direction: column-reverse; }
    .photo-side { padding: 36px 24px; }
    .photo-frame { width: 240px; height: 240px; }
    .intro { padding: 32px 28px; }
  }
</style>
</head>

<script>
  // 照片放入同目录 photo.jpg 后自动显示
  const img = document.getElementById('photoImg');
  const placeholder = document.getElementById('photoPlaceholder');
  img.addEventListener('load', () => {
    img.style.display = 'block';
    placeholder.style.display = 'none';
  });
  img.addEventListener('error', () => {
    img.style.display = 'none';
    placeholder.style.display = 'block';
  });
  img.src = 'photo.jpg?v=' + Date.now();
</script>
